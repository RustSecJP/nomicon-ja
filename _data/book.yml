short: Rustonomicon
title: The Rustonomicon
original_title: The Rustonomicon
seo_title: The Rustonomicon（Rust 公式ドキュメント「Rustonomicon」日本語訳）
summary: unsafe Rust のプログラムを正しく書くために知っておくべき細部を掘り下げる Rust 公式ドキュメント「The Rustonomicon」の、非公式な日本語訳。safe と unsafe の関係、データ表現、所有権とライフタイム、型変換、未初期化メモリ、例外安全性、並行性、Vec と Arc の実装、FFI までを全文訳している。
